name: 🥁 Build CV

on:
  push:
  workflow_dispatch:

concurrency:
  group: cv-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build CV outputs
        run: ./gradlew --no-daemon pandocRun

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cv-files
          path: build/CV/**

      - name: Set release tag
        id: release-date
        run: echo "tag=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and attach files
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-date.outputs.tag }}
          overwrite_files: true
          files: build/CV/**

      - name: Move latest tag to this commit
        run: |
          git tag --force latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

      - name: Update latest GitHub release and attach files
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          overwrite_files: true
          files: build/CV/**
